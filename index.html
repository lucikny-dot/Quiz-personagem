<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qual personagem você seria?</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
    background:
        radial-gradient(circle at 20% 20%, #4b176e 0%, transparent 30%),
        radial-gradient(circle at 80% 80%, #24104d 0%, transparent 35%),
        linear-gradient(135deg, #09000f, #160020, #08000d);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    padding: 20px;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .35;
    background-image:
        radial-gradient(white 1px, transparent 1px);
    background-size: 55px 55px;
    animation: estrelas 20s linear infinite;
}

@keyframes estrelas {
    from { transform: translateY(0); }
    to { transform: translateY(-55px); }
}

.container {
    width: 100%;
    max-width: 650px;
    position: relative;
    z-index: 2;
}

.card {
    background: rgba(15, 5, 25, .88);
    border: 1px solid rgba(190, 100, 255, .3);
    border-radius: 25px;
    padding: 30px;
    box-shadow:
        0 0 50px rgba(130, 30, 200, .25),
        inset 0 0 30px rgba(120, 30, 180, .05);
    backdrop-filter: blur(12px);
}

.logo {
    text-align: center;
    font-size: 48px;
    margin-bottom: 10px;
    animation: flutuar 3s ease-in-out infinite;
}

@keyframes flutuar {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
}

h1 {
    text-align: center;
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #c8afd8;
    line-height: 1.5;
    margin-bottom: 25px;
}

.creator {
    text-align: center;
    color: #a96bdd;
    font-size: 13px;
    margin-top: 20px;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 16px;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(135deg, #7b20b5, #b044e9);
    box-shadow: 0 8px 25px rgba(145, 35, 210, .25);
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(180, 60, 240, .4);
}

button:active {
    transform: scale(.98);
}

.hidden {
    display: none !important;
}

/* PROGRESSO */

.progress-area {
    margin-bottom: 25px;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    color: #c7acd5;
    font-size: 13px;
    margin-bottom: 8px;
}

.progress {
    height: 8px;
    background: #291531;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7b20b5, #d86aff);
    border-radius: 20px;
    transition: width .3s;
}

/* PERGUNTAS */

.question {
    font-size: 23px;
    line-height: 1.35;
    margin-bottom: 22px;
}

.options {
    display: grid;
    gap: 12px;
}

.option {
    width: 100%;
    text-align: left;
    padding: 16px;
    border-radius: 14px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(190,100,255,.2);
    color: #fff;
    font-weight: normal;
    box-shadow: none;
}

.option:hover {
    background: rgba(150,50,220,.18);
    border-color: rgba(200,100,255,.6);
}

/* RESULTADO */

.result-symbol {
    font-size: 75px;
    text-align: center;
    margin-bottom: 5px;
    animation: aparecer .7s ease;
}

.result-title {
    text-align: center;
    font-size: 32px;
    margin-bottom: 12px;
}

.result-description {
    text-align: center;
    color: #d2bddc;
    line-height: 1.6;
    margin-bottom: 25px;
}

.traits {
    display: grid;
    gap: 14px;
    margin-bottom: 25px;
}

.trait-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 6px;
}

.trait-bar {
    height: 9px;
    background: #28162f;
    border-radius: 20px;
    overflow: hidden;
}

.trait-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #7720aa, #d45fff);
    border-radius: 20px;
    transition: width 1s ease;
}

.secondary {
    text-align: center;
    padding: 15px;
    border-radius: 15px;
    background: rgba(150,50,220,.09);
    border: 1px solid rgba(180,90,240,.15);
    margin-bottom: 20px;
    color: #d8c6df;
}

.actions {
    display: grid;
    gap: 10px;
}

.secondary-button {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(190,100,255,.25);
    box-shadow: none;
}

@keyframes aparecer {
    from {
        opacity: 0;
        transform: scale(.7);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

/* RESPONSIVO */

@media (max-width: 500px) {
    .card {
        padding: 22px;
        border-radius: 20px;
    }

    h1 {
        font-size: 25px;
    }

    .question {
        font-size: 20px;
    }

    .result-title {
        font-size: 27px;
    }

    .logo {
        font-size: 40px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- INÍCIO -->
    <div class="card" id="startScreen">

        <div class="logo">🔮</div>

        <h1>QUAL PERSONAGEM<br>VOCÊ SERIA?</h1>

        <p class="subtitle">
            Responda 10 perguntas e descubra qual personalidade
            combina mais com você.
        </p>

        <button onclick="startQuiz()">
            ✨ COMEÇAR TESTE
        </button>

        <div class="creator">
            Criado por @sklu_ci 💡
        </div>

    </div>


    <!-- QUIZ -->
    <div class="card hidden" id="quizScreen">

        <div class="progress-area">

            <div class="progress-top">
                <span id="questionNumber">Pergunta 1 de 10</span>
                <span id="percentage">10%</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>

        <div id="questionContainer"></div>

    </div>


    <!-- RESULTADO -->
    <div class="card hidden" id="resultScreen">

        <div class="result-symbol" id="resultSymbol"></div>

        <h2 class="result-title" id="resultTitle"></h2>

        <p class="result-description" id="resultDescription"></p>

        <div class="traits">

            <div>
                <div class="trait-head">
                    <span>❤️ Personalidade</span>
                    <span id="personalityValue">0%</span>
                </div>

                <div class="trait-bar">
                    <div class="trait-fill" id="personalityBar"></div>
                </div>
            </div>

            <div>
                <div class="trait-head">
                    <span>💀 Caos</span>
                    <span id="chaosValue">0%</span>
                </div>

                <div class="trait-bar">
                    <div class="trait-fill" id="chaosBar"></div>
                </div>
            </div>

            <div>
                <div class="trait-head">
                    <span>🌑 Mistério</span>
                    <span id="mysteryValue">0%</span>
                </div>

                <div class="trait-bar">
                    <div class="trait-fill" id="mysteryBar"></div>
                </div>
            </div>

        </div>

        <div class="secondary" id="secondaryResult"></div>

        <div class="actions">

            <button onclick="shareStory()">
                📸 COMPARTILHAR NO STORY
            </button>

            <button class="secondary-button" onclick="challengeFriend()">
                👥 DESAFIAR UM AMIGO
            </button>

            <button class="secondary-button" onclick="restartQuiz()">
                🔄 FAZER NOVAMENTE
            </button>

        </div>

        <div class="creator">
            Criado por @sklu_ci 💡
        </div>

    </div>

</div>


<script>

const questions = [

{
    question: "Quando alguma coisa dá errado, você...",
    options: [
        ["Tenta resolver e segue em frente.", "protagonista"],
        ["Fica pensando nisso por horas.", "melancolico"],
        ["Faz alguma coisa completamente inesperada.", "caotico"],
        ["Fica quieto e observa.", "misterioso"],
        ["Tenta proteger quem está envolvido.", "guardiao"],
        ["Analisa tudo antes de agir.", "estrategista"]
    ]
},

{
    question: "Qual lugar você escolheria para passar uma noite?",
    options: [
        ["Uma cidade cheia de gente.", "protagonista"],
        ["Uma casa silenciosa.", "melancolico"],
        ["Uma festa que ninguém conhece.", "caotico"],
        ["Uma floresta durante a noite.", "misterioso"],
        ["Uma casa com seus amigos.", "guardiao"],
        ["Um lugar secreto que ninguém conhece.", "estrategista"]
    ]
},

{
    question: "Qual frase combina mais com você?",
    options: [
        ["Eu vou conseguir.", "protagonista"],
        ["Algumas coisas simplesmente ficam na cabeça.", "melancolico"],
        ["Depois eu penso nisso.", "caotico"],
        ["Nem tudo precisa ser explicado.", "misterioso"],
        ["Eu não vou deixar ninguém para trás.", "guardiao"],
        ["Sempre existe uma maneira.", "estrategista"]
    ]
},

{
    question: "Você descobre um segredo. O que faz?",
    options: [
        ["Investigo até descobrir tudo.", "protagonista"],
        ["Fico pensando sobre aquilo.", "melancolico"],
        ["Provavelmente conto para alguém.", "caotico"],
        ["Guardo para mim.", "misterioso"],
        ["Protejo quem poderia ser prejudicado.", "guardiao"],
        ["Uso a informação com inteligência.", "estrategista"]
    ]
},

{
    question: "Uma pessoa que você gosta está triste. Você...",
    options: [
        ["Tenta animá-la.", "protagonista"],
        ["Senta ao lado e escuta.", "melancolico"],
        ["Faz alguma besteira para ela rir.", "caotico"],
        ["Fica perto mesmo sem falar muito.", "misterioso"],
        ["Faz de tudo para ajudá-la.", "guardiao"],
        ["Procura uma solução para o problema.", "estrategista"]
    ]
},

{
    question: "O que mais chama sua atenção?",
    options: [
        ["Aventura.", "protagonista"],
        ["Música.", "melancolico"],
        ["Confusão.", "caotico"],
        ["Mistérios.", "misterioso"],
        ["Pessoas.", "guardiao"],
        ["Estratégias.", "estrategista"]
    ]
},

{
    question: "Quando você gosta de alguém...",
    options: [
        ["Demonstra.", "protagonista"],
        ["Sente muito, mas às vezes não fala.", "melancolico"],
        ["Faz brincadeiras para esconder.", "caotico"],
        ["Mantém parte dos sentimentos em segredo.", "misterioso"],
        ["Se preocupa muito com a pessoa.", "guardiao"],
        ["Pensa bastante antes de se entregar.", "estrategista"]
    ]
},

{
    question: "Qual seria sua arma em uma história?",
    options: [
        ["Uma espada.", "protagonista"],
        ["Uma música.", "melancolico"],
        ["Qualquer coisa que estiver por perto.", "caotico"],
        ["Uma adaga escondida.", "misterioso"],
        ["Um escudo.", "guardiao"],
        ["Uma arma extremamente precisa.", "estrategista"]
    ]
},

{
    question: "Você prefere...",
    options: [
        ["Viver uma grande aventura.", "protagonista"],
        ["Uma noite tranquila.", "melancolico"],
        ["Fazer algo completamente aleatório.", "caotico"],
        ["Descobrir algo que ninguém sabe.", "misterioso"],
        ["Estar com quem ama.", "guardiao"],
        ["Ter tudo planejado.", "estrategista"]
    ]
},

{
    question: "Como você gostaria de ser lembrado?",
    options: [
        ["Como alguém que viveu intensamente.", "protagonista"],
        ["Como alguém que sentia profundamente.", "melancolico"],
        ["Como alguém impossível de esquecer.", "caotico"],
        ["Como alguém que ninguém conseguiu decifrar.", "misterioso"],
        ["Como alguém que sempre esteve lá.", "guardiao"],
        ["Como alguém que sempre tinha um plano.", "estrategista"]
    ]
}

];


const results = {

    protagonista: {
        symbol: "🌟",
        title: "O PROTAGONISTA",
        description: "Você gosta de viver sua própria história. Quando aparece um desafio, alguma parte de você quer enfrentar e descobrir até onde consegue chegar.",
        personality: 93,
        chaos: 55,
        mystery: 58
    },

    melancolico: {
        symbol: "🌙",
        title: "O MELANCÓLICO",
        description: "Você sente as coisas profundamente. Guarda memórias, percebe pequenos detalhes e muitas vezes existe muito mais acontecendo dentro de você do que as pessoas imaginam.",
        personality: 97,
        chaos: 25,
        mystery: 84
    },

    caotico: {
        symbol: "💀",
        title: "O CAÓTICO",
        description: "Previsibilidade definitivamente não é sua especialidade. Você transforma situações normais em histórias que provavelmente ninguém vai esquecer.",
        personality: 81,
        chaos: 99,
        mystery: 49
    },

    misterioso: {
        symbol: "🕯️",
        title: "O MISTERIOSO",
        description: "Você não entrega tudo de primeira. Observa, pensa e deixa algumas partes da sua história somente para quem realmente merece conhecê-las.",
        personality: 89,
        chaos: 37,
        mystery: 99
    },

    guardiao: {
        symbol: "🛡️",
        title: "O GUARDIÃO",
        description: "Você valoriza as pessoas que ama e tende a estar presente quando realmente importa. Para você, algumas pessoas valem qualquer esforço.",
        personality: 94,
        chaos: 35,
        mystery: 67
    },

    estrategista: {
        symbol: "♟️",
        title: "O ESTRATEGISTA",
        description: "Você prefere pensar antes de agir. Enquanto outras pessoas estão reagindo, você provavelmente já está imaginando os próximos passos.",
        personality: 91,
        chaos: 29,
        mystery: 79
    },

    secreto: {
        symbol: "🩸",
        title: "O INCLASSIFICÁVEL",
        description: "Você conseguiu uma combinação extremamente incomum. Nem protagonista, nem vilão, nem herói... aparentemente você simplesmente joga pelas suas próprias regras.",
        personality: 100,
        chaos: 100,
        mystery: 100
    }

};


let currentQuestion = 0;
let scores = {
    protagonista: 0,
    melancolico: 0,
    caotico: 0,
    misterioso: 0,
    guardiao: 0,
    estrategista: 0
};

let finalResult = null;


function startQuiz() {

    currentQuestion = 0;

    scores = {
        protagonista: 0,
        melancolico: 0,
        caotico: 0,
        misterioso: 0,
        guardiao: 0,
        estrategista: 0
    };

    document.getElementById("startScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.add("hidden");
    document.getElementById("quizScreen").classList.remove("hidden");

    showQuestion();

}


function showQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("questionNumber").textContent =
        `Pergunta ${currentQuestion + 1} de ${questions.length}`;

    const percentage =
        Math.round(((currentQuestion + 1) / questions.length) * 100);

    document.getElementById("percentage").textContent =
        percentage + "%";

    document.getElementById("progressBar").style.width =
        percentage + "%";


    const container =
        document.getElementById("questionContainer");

    container.innerHTML = "";

    const title = document.createElement("div");

    title.className = "question";
    title.textContent = q.question;

    container.appendChild(title);


    const options = document.createElement("div");

    options.className = "options";


    q.options.forEach(option => {

        const button = document.createElement("button");

        button.className = "option";
        button.textContent = option[0];

        button.onclick = () => answer(option[1]);

        options.appendChild(button);

    });


    container.appendChild(options);

}


function answer(type) {

    scores[type]++;

    currentQuestion++;

    if (currentQuestion < questions.length) {

        showQuestion();

    } else {

        showResult();

    }

}


function showResult() {

    document.getElementById("quizScreen").classList.add("hidden");
    document.getElementById("resultScreen").classList.remove("hidden");

    const sorted =
        Object.entries(scores).sort((a,b) => b[1] - a[1]);

    const first = sorted[0];
    const second = sorted[1];

    /*
       Resultado secreto:
       aparece apenas se houver empate total
       entre pelo menos 4 personalidades.
    */

    const maxScore = first[1];

    const tied =
        sorted.filter(item => item[1] === maxScore);

    if (tied.length >= 4) {

        finalResult = "secreto";

    } else {

        finalResult = first[0];

    }


    const result = results[finalResult];


    document.getElementById("resultSymbol").textContent =
        result.symbol;

    document.getElementById("resultTitle").textContent =
        result.title;

    document.getElementById("resultDescription").textContent =
        result.description;


    document.getElementById("personalityValue").textContent =
        result.personality + "%";

    document.getElementById("chaosValue").textContent =
        result.chaos + "%";

    document.getElementById("mysteryValue").textContent =
        result.mystery + "%";


    setTimeout(() => {

        document.getElementById("personalityBar").style.width =
            result.personality + "%";

        document.getElementById("chaosBar").style.width =
            result.chaos + "%";

        document.getElementById("mysteryBar").style.width =
            result.mystery + "%";

    }, 100);


    if (finalResult === "secreto") {

        document.getElementById("secondaryResult").innerHTML =
            "🩸 <strong>RESULTADO RARO!</strong><br>Você desbloqueou o resultado secreto.";

    } else {

        const secondResult = results[second[0]];

        document.getElementById("secondaryResult").innerHTML =
            `Além disso, você também possui traços de <strong>${secondResult.title}</strong> ${secondResult.symbol}.`;

    }

}


function restartQuiz() {

    document.getElementById("resultScreen").classList.add("hidden");
    startQuiz();

}


function challengeFriend() {

    const text =
        `Eu descobri que sou ${results[finalResult].title} ${results[finalResult].symbol}! 😈\n\nE você? Descobre o seu fazendo o teste 👀`;

    const url = window.location.href;

    if (navigator.share) {

        navigator.share({
            title: "Qual personagem você seria?",
            text: text,
            url: url
        }).catch(() => {});

    } else {

        navigator.clipboard.writeText(
            text + "\n" + url
        );

        alert("Mensagem copiada! Agora é só mandar para seu amigo 😎");

    }

}


async function shareStory() {

    const result = results[finalResult];

    const canvas =
        document.createElement("canvas");

    canvas.width = 1080;
    canvas.height = 1920;

    const ctx =
        canvas.getContext("2d");


    /* FUNDO */

    const gradient =
        ctx.createLinearGradient(0,0,1080,1920);

    gradient.addColorStop(0, "#08000d");
    gradient.addColorStop(.5, "#21072f");
    gradient.addColorStop(1, "#08000d");

    ctx.fillStyle = gradient;

    ctx.fillRect(0,0,1080,1920);


    /* ESTRELAS */

    for(let i = 0; i < 100; i++) {

        const x = Math.random() * 1080;
        const y = Math.random() * 1920;
        const size = Math.random() * 4 + 1;

        ctx.fillStyle =
            "rgba(255,255,255," +
            (Math.random() * .7 + .2) +
            ")";

        ctx.beginPath();
        ctx.arc(x,y,size,0,Math.PI*2);
        ctx.fill();

    }


    ctx.textAlign = "center";


    /* TÍTULO */

    ctx.fillStyle = "#d8a5ff";
    ctx.font = "bold 48px Arial";

    ctx.fillText(
        "QUAL PERSONAGEM",
        540,
        180
    );

    ctx.fillText(
        "VOCÊ SERIA?",
        540,
        240
    );


    /* SÍMBOLO */

    ctx.font = "170px Arial";

    ctx.fillText(
        result.symbol,
        540,
        530
    );


    /* RESULTADO */

    ctx.fillStyle = "#ffffff";

    ctx.font = "bold 68px Arial";

    ctx.fillText(
        result.title,
        540,
        680
    );


    /* DESCRIÇÃO */

    ctx.fillStyle = "#d5bfdc";

    ctx.font = "32px Arial";

    const words =
        result.description.split(" ");

    let line = "";
    let lines = [];

    for (let word of words) {

        const test =
            line + word + " ";

        if (ctx.measureText(test).width > 800) {

            lines.push(line);
            line = word + " ";

        } else {

            line = test;

        }

    }

    lines.push(line);


    lines.forEach((text,index) => {

        ctx.fillText(
            text,
            540,
            810 + index * 48
        );

    });


    /* BARRAS */

    const traits = [

        ["PERSONALIDADE", result.personality],
        ["CAOS", result.chaos],
        ["MISTÉRIO", result.mystery]

    ];


    let y = 1100;


    traits.forEach(trait => {

        ctx.textAlign = "left";

        ctx.fillStyle = "#ffffff";

        ctx.font = "bold 28px Arial";

        ctx.fillText(
            trait[0],
            150,
            y
        );


        ctx.textAlign = "right";

        ctx.fillText(
            trait[1] + "%",
            930,
            y
        );


        ctx.fillStyle = "#32193d";

        ctx.fillRect(
            150,
            y + 20,
            780,
            18
        );


        ctx.fillStyle = "#b94dff";

        ctx.fillRect(
            150,
            y + 20,
            780 * trait[1] / 100,
            18
        );


        y += 120;

    });


    /* RODAPÉ */

    ctx.textAlign = "center";

    ctx.fillStyle = "#c28ce5";

    ctx.font = "bold 30px Arial";

    ctx.fillText(
        "Criado por @sklu_ci 💡",
        540,
        1660
    );


    ctx.fillStyle = "#80648c";

    ctx.font = "24px Arial";

    ctx.fillText(
        "Faça o teste e descubra o seu.",
        540,
        1710
    );


    /* GERAR IMAGEM */

    canvas.toBlob(async blob => {

        if (!blob) return;

        const file =
            new File(
                [blob],
                "meu-resultado.png",
                { type: "image/png" }
            );


        /* CELULAR */

        if (
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({ files: [file] })
        ) {

            try {

                await navigator.share({

                    title: "Meu resultado",
                    text:
                        `Eu sou ${result.title} ${result.symbol}! Descubra o seu 👀`,
                    files: [file]

                });

                return;

            } catch (error) {

                console.log("Compartilhamento cancelado.");

            }

        }


        /* COMPUTADOR / FALLBACK */

        const link =
